[project]
name = "fakturaer-fra-prisme-til-ski"
version = "0.2.1"
description = "Henter originale OIOUBL-fakturaer fra Prisme og pakker dem ugevis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "q-haderslev-vbo",
    "q-prisme365-api",
    "q-oioubl-faktura-parser",
    "q-sharepoint-api",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.3.0" }
q-haderslev-vbo = { git = "https://github.com/haderslev-rpa/q-haderslev-vbo.git", branch = "main" }
q-prisme365-api = { git = "https://github.com/haderslev-rpa/q-prisme365-api.git", branch = "main" }
q-oioubl-faktura-parser = { git = "https://github.com/haderslev-rpa/q-oioubl-faktura-parser.git", branch = "main" }
q-sharepoint-api = { git = "https://github.com/haderslev-rpa/q-sharepoint-api.git", branch = "main" }
